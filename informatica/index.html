<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Informatica Notes</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('ichat-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h16"/></svg>
          </span>
          <div>
            <h1>Informatica Notes</h1>
            <p id="status"><i class="dot"></i><span>Connecting…</span></p>
          </div>
        </div>
        <button id="theme" class="icon-btn" type="button" aria-label="Toggle light or dark theme" title="Toggle theme"></button>
      </header>

      <main id="list" class="list" aria-live="polite"></main>

      <div id="gate" class="gate" hidden>
        <h2>Private notebook</h2>
        <p>Open your personal link to continue. It only needs to be opened once on each device.</p>
      </div>

      <footer class="composer" id="composer">
        <div id="attach-preview" class="attach-preview" hidden></div>
        <div class="row">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" hidden />
          <button id="attach" class="icon-btn" type="button" aria-label="Attach an image or PDF" title="Attach image or PDF">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 115.7 5.7l-9.2 9.2a2 2 0 11-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <textarea id="text" rows="1" placeholder="Ask a question or post an update…" aria-label="Message"></textarea>
          <button id="send" class="send" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift+Enter for a new line</p>
      </footer>
    </div>
    <script type="module" src="/src/informatica/main.js"></script>
  </body>
</html>
